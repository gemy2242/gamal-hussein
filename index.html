<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gamal Hussein — Finance Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Sans:wght@300;400;500&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --navy:   #0f3460;
    --gold:   #c9a84c;
    --gold2:  #e8c97a;
    --dark:   #0a0a0f;
    --mid:    #1a1a2e;
    --text:   #e8e6e0;
    --muted:  #8a8a9a;
    --glass:  rgba(255,255,255,0.04);
    --border: rgba(201,168,76,0.2);
    --bg-hero: radial-gradient(ellipse 60% 80% at 70% 50%, rgba(15,52,96,0.4) 0%, transparent 70%);
  }

  /* ثيم الوضع المضيء (Light Mode) */
  body.light-theme {
    --dark:   #f4f6f9;
    --mid:    #ffffff;
    --text:   #1a1a2e;
    --muted:  #606070;
    --glass:  rgba(15,52,96,0.03);
    --border: rgba(15,52,96,0.15);
    --bg-hero: radial-gradient(ellipse 60% 80% at 70% 50%, rgba(201,168,76,0.15) 0%, transparent 70%);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }

  body.ar {
    font-family: 'Cairo', sans-serif;
    direction: rtl;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 60px;
    background: var(--mid);
    opacity: 0.95;
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 600;
    color: var(--gold); letter-spacing: 1px;
  }
  .nav-right { display: flex; align-items: center; gap: 20px; }
  .nav-links { display: flex; gap: 28px; list-style: none; }
  .nav-links a {
    color: var(--muted); text-decoration: none;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    transition: color .3s;
  }
  .nav-links a:hover { color: var(--gold); }
  
  /* أزرار التحكم في أعلى الموقع */
  .control-btn {
    background: var(--border); border: 1px solid var(--border);
    color: var(--gold); padding: 8px 18px; border-radius: 30px;
    cursor: pointer; font-size: 13px; letter-spacing: 1px;
    transition: all .3s; font-family: inherit;
  }
  .control-btn:hover { background: var(--gold); color: #0a0a0f; }

  /* ── HERO ── */
  #hero {
    min-height: 100vh;
    display: grid; grid-template-columns: 1fr 1fr;
    align-items: center; gap: 60px;
    padding: 120px 60px 80px;
    position: relative; overflow: hidden;
  }
  #hero::before {
    content: '';
    position: absolute; inset: 0;
    background: var(--bg-hero);
    pointer-events: none;
  }
  .hero-text { position: relative; z-index: 2; }
  .hero-eyebrow {
    font-size: 12px; letter-spacing: 4px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .hero-eyebrow::before {
    content: ''; display: block; width: 40px; height: 1px; background: var(--gold);
  }
  body.ar .hero-eyebrow::before { display: none; }
  body.ar .hero-eyebrow::after { content: ''; display: block; width: 40px; height: 1px; background: var(--gold); }

  .hero-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(52px, 7vw, 88px);
    font-weight: 700; line-height: 1.0;
    color: var(--text); margin-bottom: 16px;
    letter-spacing: -1px;
  }
  body.light-theme .hero-name { color: #000; }

  .hero-title {
    font-size: 16px; color: var(--muted);
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 32px;
  }
  .hero-hook {
    font-size: 18px; line-height: 1.7;
    color: var(--text);
    opacity: 0.8;
    max-width: 480px; margin-bottom: 48px;
    border-left: 2px solid var(--gold);
    padding-left: 20px;
  }
  body.ar .hero-hook { border-left: none; border-right: 2px solid var(--gold); padding-left: 0; padding-right: 20px; }
  .hero-ctas { display: flex; gap: 16px; flex-wrap: wrap; }
  
  .btn-primary {
    background: var(--gold); color: #0a0a0f;
    padding: 14px 32px; border-radius: 4px;
    text-decoration: none; font-size: 13px;
    letter-spacing: 1px; text-transform: uppercase;
    font-weight: 500; transition: all .3s;
    border: none; cursor: pointer;
  }
  .btn-primary:hover { background: var(--gold2); transform: translateY(-2px); }
  .btn-outline {
    border: 1px solid var(--border); color: var(--text);
    padding: 14px 32px; border-radius: 4px;
    text-decoration: none; font-size: 13px;
    letter-spacing: 1px; text-transform: uppercase;
    transition: all .3s; display: flex; align-items: center; gap: 8px;
  }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
  
  .hero-photo-wrap {
    position: relative; z-index: 2;
    display: flex; justify-content: center; align-items: center;
  }
  .photo-frame {
    position: relative; width: 420px; height: 520px;
  }
  .photo-frame::before {
    content: '';
    position: absolute; inset: -2px;
    background: linear-gradient(135deg, var(--gold) 0%, transparent 50%, var(--navy) 100%);
    border-radius: 4px; z-index: 0;
  }
  .photo-frame img {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    object-fit: cover; border-radius: 3px;
    filter: grayscale(20%) contrast(1.05);
  }
  .photo-badge {
    position: absolute; bottom: -20px; right: -20px; z-index: 3;
    background: var(--gold); color: #0a0a0f;
    padding: 16px 20px; border-radius: 4px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px; font-weight: 700;
    text-align: center; line-height: 1.3;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  body.ar .photo-badge { right: auto; left: -20px; }

  /* ── METRICS ── */
  #metrics {
    padding: 60px;
    background: var(--mid);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .metrics-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1px; background: var(--border);
    border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
  }
  .metric-card {
    background: var(--mid); padding: 48px 40px;
    text-align: center; position: relative;
    transition: background .3s;
  }
  .metric-card:hover { background: rgba(201,168,76,0.06); }
  .metric-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 64px; font-weight: 700;
    color: var(--gold); line-height: 1;
    margin-bottom: 12px;
  }
  .metric-label {
    font-size: 13px; color: var(--muted);
    letter-spacing: 1px; text-transform: uppercase;
  }

  /* ── SECTIONS ── */
  section { padding: 100px 60px; }
  .section-label {
    font-size: 11px; letter-spacing: 5px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .section-label::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(36px, 4vw, 52px);
    font-weight: 600; color: var(--text);
    margin-bottom: 60px; max-width: 600px;
  }
  body.light-theme .section-title { color: #000; }

  /* ── ABOUT ── */
  #about { background: var(--dark); }
  .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start; }
  .about-text { font-size: 16px; line-height: 1.9; color: var(--text); opacity: 0.8; }
  .about-text p + p { margin-top: 20px; }
  .contact-list { list-style: none; display: flex; flex-direction: column; gap: 16px; }
  .contact-item {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 20px; background: var(--glass);
    border: 1px solid var(--border); border-radius: 4px;
    transition: all .3s;
  }
  .contact-item:hover { border-color: var(--gold); background: rgba(201,168,76,0.06); }
  .contact-icon { color: var(--gold); font-size: 18px; width: 24px; text-align: center; }
  .contact-item a { color: var(--text); text-decoration: none; font-size: 14px; }
  .contact-item a:hover { color: var(--gold); }

  /* ── TIMELINE ── */
  #experience { background: var(--mid); }
  .timeline { position: relative; padding-left: 40px; }
  body.ar .timeline { padding-left: 0; padding-right: 40px; }
  .timeline::before {
    content: ''; position: absolute;
    left: 0; top: 0; bottom: 0; width: 1px;
    background: linear-gradient(to bottom, var(--gold), transparent);
  }
  body.ar .timeline::before { left: auto; right: 0; }
  .timeline-item { position: relative; margin-bottom: 60px; }
  .timeline-dot {
    position: absolute; left: -44px; top: 8px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--gold); border: 2px solid var(--dark);
    box-shadow: 0 0 12px rgba(201,168,76,0.6);
  }
  body.ar .timeline-dot { left: auto; right: -44px; }
  .timeline-meta {
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 8px;
  }
  .timeline-role {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px; font-weight: 600; color: var(--text);
    margin-bottom: 4px;
  }
  body.light-theme .timeline-role { color: #000; }
  .timeline-company { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
  
  .timeline-promo {
    display: inline-block;
    background: rgba(201,168,76,0.15); border: 1px solid var(--border);
    color: var(--gold); font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; padding: 4px 12px; border-radius: 20px;
    margin-bottom: 20px;
  }
  .timeline-bullets { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .timeline-bullets li {
    display: flex; gap: 12px; align-items: flex-start;
    font-size: 14px; line-height: 1.7; color: var(--text); opacity: 0.7;
  }
  .timeline-bullets li::before {
    content: '▸'; color: var(--gold); flex-shrink: 0; margin-top: 2px;
  }
  body.ar .timeline-bullets li::before { content: '◂'; }

  /* ── PROJECTS ── */
  #projects { background: var(--dark); }
  .projects-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .project-card {
    border: 1px solid var(--border); border-radius: 6px;
    padding: 40px; background: var(--glass);
    transition: all .4s; position: relative; overflow: hidden;
  }
  .project-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(to right, var(--gold), transparent);
  }
  .project-card:hover { border-color: var(--gold); transform: translateY(-4px); }
  .project-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 60px; font-weight: 700;
    color: rgba(201,168,76,0.08); line-height: 1;
    margin-bottom: -20px;
  }
  .project-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px; font-weight: 600;
    color: var(--text); margin-bottom: 8px;
  }
  body.light-theme .project-name { color: #000; }
  .project-tag {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 20px;
  }
  .project-desc {
    font-size: 14px; line-height: 1.8;
    color: var(--muted);
  }

  /* ── SKILLS ── */
  #skills { background: var(--mid); }
  .skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .skill-row {
    background: var(--mid); padding: 24px 32px;
    display: flex; justify-content: space-between; align-items: center;
    transition: background .3s;
  }
  .skill-row:hover { background: rgba(201,168,76,0.05); }
  .skill-cat { font-size: 13px; font-weight: 500; color: var(--gold); letter-spacing: 1px; }
  .skill-detail { font-size: 13px; color: var(--muted); text-align: right; max-width: 300px; }
  body.ar .skill-detail { text-align: left; }

  /* ── EDUCATION ── */
  #education { background: var(--dark); }
  .edu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
  .edu-card {
    border: 1px solid var(--border); border-radius: 4px;
    padding: 32px; background: var(--glass);
    transition: all .3s;
  }
  .edu-card:hover { border-color: var(--gold); }
  .edu-degree { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  body.light-theme .edu-degree { color: #000; }
  .edu-inst { font-size: 13px; color: var(--gold); margin-bottom: 6px; }
  .edu-date { font-size: 12px; color: var(--muted); letter-spacing: 1px; }

  /* ── FOOTER ── */
  footer {
    background: var(--dark);
    border-top: 1px solid var(--border);
    padding: 40px 60px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .footer-name { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--gold); }
  .footer-copy { font-size: 12px; color: var(--muted); letter-spacing: 1px; }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp .8s ease-out both; }
  .delay-1 { animation-delay: .1s; }
  .delay-2 { animation-delay: .2s; }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    nav { padding: 16px 24px; flex-wrap: wrap; gap: 10px; }
    .nav-links { display: none; }
    #hero { grid-template-columns: 1fr; padding: 140px 24px 60px; }
    .hero-photo-wrap { order: -1; }
    .photo-frame { width: 280px; height: 340px; }
    section { padding: 60px 24px; }
    #metrics { padding: 40px 24px; }
    .metrics-grid { grid-template-columns: 1fr; }
    .about-grid { grid-template-columns: 1fr; gap: 40px; }
    .projects-grid { grid-template-columns: 1fr; }
    .skills-grid { grid-template-columns: 1fr; }
    .edu-grid { grid-template-columns: 1fr; }
    footer { flex-direction: column; gap: 12px; text-align: center; padding: 32px 24px; }
    .skill-row { flex-direction: column; align-items: flex-start; gap: 8px; }
    .skill-detail { text-align: left; }
  }

  /* ── كود خاص بتنسيق الطباعة وتحميل الـ PDF (A4 المنسق) ── */
  @media print {
    body {
      background: #ffffff !important;
      color: #000000 !important;
      font-family: 'Arial', sans-serif !important;
      font-size: 12pt !important;
    }
    nav, .hero-ctas, .control-btn, .photo-frame::before, .photo-badge, footer {
      display: none !important; /* إخفاء العناصر غير الضرورية للطباعة */
    }
    #hero {
      display: block !important;
      padding: 0 !important;
      min-height: auto !important;
    }
    .photo-frame img {
      width: 150px !important;
      height: 180px !important;
      float: right;
      margin-left: 20px;
    }
    body.ar .photo-frame img {
      float: left;
      margin-right: 20px;
    }
    .hero-name {
      color: #000000 !important;
      font-size: 28pt !important;
    }
    .hero-title, .section-title, .timeline-role, .project-name, .edu-degree {
      color: #0f3460 !important; /* الحفاظ على لون داكن رسمي للشركة */
    }
    section {
      padding: 20px 0 !important;
      page-break-inside: avoid; /* منع قطع الأقسام بين الصفحات */
    }
    .metrics-grid, .about-grid, .projects-grid, .skills-grid, .edu-grid {
      display: block !important;
    }
    .metric-card, .project-card, .edu-card, .skill-row {
      background: #ffffff !important;
      border: 1px solid #cccccc !important;
      margin-bottom: 10px !important;
      padding: 15px !important;
      page-break-inside: avoid;
    }
    .timeline::before, .timeline-dot {
      border-color: #0f3460 !important;
    }
  }
</style>
</head>
<body id="body">

<nav>
  <div class="nav-logo">GH</div>
  <div class="nav-right">
    <ul class="nav-links">
      <li><a href="#about" data-en="About" data-ar="عني">About</a></li>
      <li><a href="#experience" data-en="Experience" data-ar="الخبرات">Experience</a></li>
      <li><a href="#projects" data-en="Projects" data-ar="المشاريع">Projects</a></li>
      <li><a href="#education" data-en="Education" data-ar="التعليم">Education</a></li>
    </ul>
    <button class="control-btn" id="themeToggle">☀️ Light Mode</button>
    <button class="control-btn" id="langToggle">عربي</button>
  </div>
</nav>

<section id="hero">
  <div class="hero-text fade-up">
    <div class="hero-eyebrow" data-en="Finance Manager" data-ar="مدير مالي">Finance Manager</div>
    <h1 class="hero-name">Gamal<br/>Hussein</h1>
    <div class="hero-title" data-en="Building Financial Systems That Drive Growth" data-ar="بناء أنظمة مالية تقود النمو">Building Financial Systems That Drive Growth</div>
    <p class="hero-hook" data-en="Built a company's entire finance department from zero — then automated it with a proprietary AI-powered tool." data-ar="بنيت إدارة مالية متكاملة من الصفر لشركة كاملة — ثم آليتها بأداة رقمية خاصة من تطويري.">
      Built a company's entire finance department from zero — then automated it with a proprietary AI-powered tool.
    </p>
    <div class="hero-ctas">
      <button onclick="window.print()" class="btn-primary" data-en="Download CV (PDF)" data-ar="تحميل السيرة الذاتية (PDF)">Download CV (PDF)</button>
      <a href="https://www.linkedin.com/in/gamal-hussen0" target="_blank" class="btn-outline" data-en="↗ LinkedIn" data-ar="↗ لينكد إن">↗ LinkedIn</a>
    </div>
  </div>
